name: Render Keep Alive Ping

on:
  schedule:
    # 10분마다 실행하여 Render 서버 휴면(Sleep) 방지
    - cron: '*/10 * * * *'
  workflow_dispatch: # GitHub Actions 탭에서 수동 실행 버튼 지원

jobs:
  keep-alive:
    name: Ping Render Web Service
    runs-on: ubuntu-latest
    steps:
      - name: Send Keep-Alive Ping
        run: |
          echo "Sending keep-alive ping to Render at $(date)..."
          HTTP_STATUS=$(curl -o /dev/null -s -w "%{http_code}" --max-time 60 "https://rag-english-fair.onrender.com/")
          echo "HTTP Response Status: $HTTP_STATUS"
          if [ "$HTTP_STATUS" -eq 200 ]; then
            echo "Render service is awake and running!"
          else
            echo "Checking API endpoint..."
            curl -s --max-time 60 "https://rag-english-fair.onrender.com/api/grammar-roadmap" > /dev/null || true
          fi

